<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>雪师傅的特别感谢！</title>
  <style>
    * {
  -webkit-tap-highlight-color: transparent !important;
}
    body {
      margin: 0;
      background: #000;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;  }
    #text {
      color: #fff;
      font-size: 40px;
      text-align: center;
      font-family: "Times New Roman", "KaiTi", serif;
      max-width: 80vw;
      opacity: 0;
      transition: opacity 0.3s;
      line-height: 1.6;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    #text.show { opacity: 1; }
    .admin-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(0,0,0,0.9);
      padding: 12px;
      border-radius: 10px;
      display: none;
      gap: 8px;
      flex-wrap: wrap;
      z-index: 100;
      border: 1px solid #333;
    }
    body.admin .admin-panel { display: flex; }
    .admin-panel input, .admin-panel button, .admin-panel textarea, .admin-panel select {
      padding: 6px 10px;
      border-radius: 6px;
      background: #222;
      color: #fff;
      border: 1px solid #555;
    }
    .admin-panel textarea { width: 100%; }
  </style>
</head>
<body>
  <div id="text"></div>
  <div class="admin-panel">
    <textarea id="words" rows="4"></textarea>
    <input type="color" id="color" value="#ffffff">
    <input type="number" id="size" value="30">
    <select id="font">
      <option value="Times New Roman, KaiTi, serif">衬线体</option>
      <option value="微软雅黑, sans-serif">微软雅黑</option>
      <option value="Arial, sans-serif">Arial</option>
    </select>
    <button id="saveBtn">💾 保存</button>
  </div>

  <script>
    const ADMIN_PASSWORD = '123456';
    
    const DEFAULT_TEXTS = `脸边痒痒的，黏重的汗已冷却。
    凌乱的发丝附着在脸上，被一只手撩开。
这只手离你很近，灌注了饱含爱意的注视。
此刻正轻柔缓慢地、一丝一缕地剥出他心里那张美好柔软的睡脸。
他现在十分清醒，守在你身边珍惜这来之不易的温存。
无限幻美的时刻，寂寞无光的黑夜也秾丽得让人着迷。
求你——
请不要这么快醒来。
哪怕让他再多看一眼——
带着万千珍重的描摹，如同丝绒舔吻。
手的主人已足够小心。

原因无他，热气腾腾的喘息实在蒸得你睡不着觉。
仿佛遭受了某种洗礼，熟悉的气味包裹并占据着你，聚拢在胸口逐渐升温。
带着他的意志喷在脸上，滑进肩窝，狂热地窜进身体里乱流。
不得不醒、不能不醒，否则下一秒就要被爱的汪洋吞没。
唔？
所以现在是什么时候了？
天还是黑的，比起模糊的视觉，耳畔极力克制的呼吸声更让你在意。
渺远却沉重，如泄露的冰山一角，浸泡着某种巨大而不可视之物。
怎么了，睡不着吗？
你往他怀里拱了拱，蹭乱了睡衣，脸抵着温热的胸膛发问——
先听到的是平稳矫健的心跳，如在黑暗中击鼓。
抱歉。
吵到你了吗？
有人带着歉意轻轻抚摸着你的后脑，不动声色地将你彻底嵌入他的身体，低喃的语气像被夜色濡湿。
易遇将下巴抵在你头顶，低头悉心梳理发丝，为你继续编织那个未做完的梦。
没有……
不知道为什么，等你有意识地再度抬头时几乎整张脸都陷在了易遇胸口，额头几乎能隐约感受到他喉结的滑动。
好近。
近到你一吐气立刻有湿热的水汽反拍在脸上，连同男人起伏的体表一并打湿，如同面对一片裸露的沼泽。
受不了了。
要窒息了。
你脸红红地想要推开他，却被易遇一把捞了回来，大手摸在你的腰上，带着点撒娇的鼻音，难得强势地不愿放你离开。
你知道，这种事有了第一次就有第二次的。
可此刻你只想纵容他。
于是你趴在易遇胸口，贴恋着他，在一闪而过的光影里偶然发现眼前那富有弹性的皮肤竟面目全非，杂乱无章地爬着写满情迷意乱的牙印。
你对自己的破坏力暗暗吃了一惊。
这……是你留下的么？今天晚上你们俩这么乱来的么？
紧致的胸肌上断断续续印着狭长的矩形，窄小的齿痕有规律地排列，一个接一个。
就像——
把人缝补起来的丝线。
拆开——
又被你拼好。
那么，又有谁会知道？
复生话事人这具长期包裹在西装和一粒粒绷紧衬衫纽扣下的身体——
锻炼良好，健美而鲜活，称得上精心保养。
到头来——
却只是为了随时随地任由你发泄？
暴殄天物，还是求之不得？
他心里早有答案。
可你……终归还是舍不得的。
呼——
虽说有人好像也挺乐在其中的，
但怎么说也是你咬的。
还是帮他……
摸一摸吧？
易先生的豆腐，不吃白不吃的嘛。
于是从被子里伸出手，点点起伏的胸口——
轻柔的、缓慢的，带着一点被弄醒的报复……
却也有得意。
扫过他身体的地图，畅通无阻、无往不利——
柔软的胸大肌瞬间紧绷。
你在心里默默数着——
一个、两个、三个……
哎呀。
看来某人今晚的次数……
好像有点多呀？
于是边摸边舔，齿痕深深，安抚地用脸轻蹭。
环在腰间的手陡然用力——
嘶……
低声却不再克制的闷哼，整个人被猛地向上托举，这次换他埋头靠在你颈窝。
弯弯绕绕的发丝蹭刮着耳后，高大的身体轻轻颤抖，易遇像在逃避着什么，又像忍受。
嗯？
这是什么反应？
刚刚你咬得真的很用力吗？
你试着回忆入睡前那些模糊的片段——
唔……
想不起来了。
只能想起那些羞人的水声，以及……
易遇滴落在你身上的汗。
被浇灌的感觉格外清晰，豆大的汗珠从他额角跳入你剧烈颤抖的小腹。
易遇似乎一直在夸奖你，从头到尾却也没放过你。
所以，说到底还是……
易遇的错吧？
入睡前的记忆被他搅得黏黏糊糊的，沐浴过温水的爱抚，几乎只剩泪痕——
最后你已经没力气叫了，湿答答地趴在浴缸里任他摆布。
是……很疼吗？
还是问一下吧。
毕竟易先生一天几百个小目标，你可耽误不起——
嗯……？
易遇轻轻笑了笑，像是没想到你会这么问，却也很满意。
不疼。
只是……
很痒。
柔软的嘴唇贴着你的后颈反复摩擦，若即若离，在你心里牵连起层叠的漪。
怎么办？
易遇抓着你的手按在胸口——
你要负责。
你要对我负责的。
闷闷的声音在你心间回响，潮声涛涛，落在耳边又如淫雨霏霏——
高低宛转、经久不绝。
雾里看花，他说的缠绵又笃定，小孩子般无理取闹的撒娇。
唔……
耳垂被咬住了，含在嘴里轻轻吹气——
易遇抱你的力道很克制，却无论如何也挣脱不开。
被他这样弄才痒呢……
手摸在后腰，舌头也……
往不该去的地方去了。
要不给你……咬回来？
你摸着易遇的发尾，朝他露出柔嫩鲜美的颈部，心里隐生出绵而麻的期待。
不如就让他糟糕地对待你好了——
反正也差不过现在了。
这一侧的敏感带都被他撩拨过，却悬而未决地——
一次次舔吮。
咬回来吗？
红肿的软肉愈发敏感，战栗却间不容发地感受着他嘴角勾起的弧度。
不要。
罕见的，拒绝的这么轻巧任性。
咬你……他可舍不得。
况且，有这些星星点点的痕迹已足够。
足够证明他的存在。
难得的谈判机会，他不想浪费——
想提更过分的要求，想得到你更多的爱——
于是他说：
“我想吻你。”
“可以吗？”
夜中无光，你却看到那双温和的铅灰色眼睛亮得星辉分明。
他在期待，嗓音沙哑，眼神却从来不曾像今天这般年轻。
他想要一个吻，一种许可，一种比肉体欢愉更长久隆重的东西——
爱。
请你同意他爱你，也希望你能爱他。
其实如果可以，易遇更希望你能亲亲他，但事情总得循序渐进着来不是吗？
那么他就要——
一个再平凡不过却前所未有的吻。
唇齿相依——
普通，却也是爱的开始。
嗯？
只是这样？
你有点怀疑。
只要这样……就好了么？
事后的体贴，也是一种温存么？
刚才他向你索取的时候好像没这么客气呀……
然而易遇眼中的郑重不假，于是你也跟着轻轻点了点头。
却随着他的靠近忽然紧张，手揪着灰色睡衣下摆揉搓。
为什么——
他只是想要一个吻呢？
又为什么——
只是一个吻，你居然感到了一种难以名状的期待和青涩呢？
甚至还有一丝微不可查的——
威胁。
你在害怕什么？
难道事情本不该如此吗？
难道有什么，就要脱离你的掌控了吗？
或许有什么将要错轨，可即便如此——
你却仍一动不动地，像被蛊惑般——
放任着——
被他捧起了脸。
吻，在黑夜中降临，异常精准地盖印在娇艳欲滴的芳唇上，止息了一切不安。
你不知道易遇是怎么做到的，或许有什么在指引着他，
又也许在你醒来前——
他已经用眼睛和手指描摹了你千百遍。
你只感到一种柔软喧嚣的躁动，随他的靠近逐渐放大……
越来越快，越来越响——
疾风一样铺天盖地地在你体内呼啸而过。
原来……
接吻是这样的么？
原来，接吻是没有声音的么？
原来，仅仅只是贴靠在一起，身体就会不自觉发烫么？
可你们的嘴唇，早已肆无忌惮地触碰过彼此更私密的部位。
后颈、腰窝、大腿、脚背……
易遇对你几乎是予取予求。
那些带着渴望的触碰，湿润而响亮，体表波光粼粼的粘液时常跃动着情欲的火光。
可就在此时，在这万籁俱寂、伸手不见五指的深夜。
你们竟也能如两片舒展的草叶般——
倾枝覆冠地交叠。
用摇曳推动另一种摇曳——
亲密如双燕衔尾，静谧如日月恒升恒落般悠远皎洁。
你望着易遇，很快被这双纯粹而真挚的眼睛盯得失去底气。
只好逃跑般闭上眼睛，心虚地用舌尖描摹他优越的唇形，彼此都十分清醒地在暗夜中交换某种情愫。
睫毛拍在眼睑，一次便心绪翻飞。
黑夜中微弱的气流冲刷着唇边细小的绒毛，热刺刺的有些痒……
奇异的感觉让你有些陌生，却没躲。
因为他在笑。
低沉舒缓的笑声，如暗夜中的丝绸，紧紧把你裹住。
真奇怪。
世上竟然有这样一个人，仅仅因为能和你接吻——
就忍不住笑出声来。
你忽然有一种直觉——
此刻就算你在他心上啃咬一口，易遇也会抚摸着那道齿痕暗自发笑。
真奇怪。
做爱的时候都没这么开心，显得你好像很贪图他的肉体似的。
你不知道接吻中的人是如何还能笑的，只感到双唇被他轻轻衔住——
温柔地舔舐……
吮吸。
易遇拉起你的手，握住指节收在掌心摩挲，最终难以自持地挤进指缝——
与你十指相扣。
双唇相分，生命的律动透过男人指骨强健如奔流般传入你体内，
怦！怦怦！
他的脉搏竟比媾和时还要快，如泄洪一般——
要冲毁一切的——岸。
去寻找一切的——帆。
呼——呼——
如泪水一般的细汗，接二连三的从体表渗出。
你努力抓住他，才不至于被海水淹没。
不知过了多久，体内的狂风终于止息了，却再也无人甘愿入眠。
你和易遇躺在床上静静等待天亮，相顾无言，却没有一刻——
松开过——所爱之人的手。
“我爱你。”
这次换你微笑了，你捧起易遇的脸轻轻抚摸，认真回望那双因兴奋微微发亮的眼睛。
“我知道。”
我一直……
都知道啊。

    const textEl = document.getElementById('text');
    const wordsArea = document.getElementById('words');
    const colorInput = document.getElementById('color');
    const sizeInput = document.getElementById('size');
    const fontSelect = document.getElementById('font');
    const saveBtn = document.getElementById('saveBtn');
    
    let paragraphs = [], currentIndex = -1;
    
    // 音乐（第一次点击页面时播放）
    const audio = new Audio('yy_bgm_wangnian.m4a');
    audio.loop = true;
    
    document.body.addEventListener('click', function playMusic() {
      audio.play().catch(e => console.log('播放失败:', e));
      document.body.removeEventListener('click', playMusic);
    }, { once: true });
    // =================================================
    
    if (location.search.includes('admin=' + ADMIN_PASSWORD)) {
      document.body.classList.add('admin');
    }
    
    function updateTexts() {
      let raw = wordsArea.value.trim();
      if (!raw) raw = DEFAULT_TEXTS;
      paragraphs = raw.split('\n').filter(l => l.trim());
      currentIndex = -1;
      textEl.classList.remove('show');
    }
    
    function showNext() {
      if (!paragraphs.length) return;
      if (currentIndex >= paragraphs.length - 1) return;
      currentIndex++;
      textEl.classList.remove('show');
      setTimeout(() => {
        textEl.textContent = paragraphs[currentIndex];
        textEl.classList.add('show');
      }, 10);
    }
    
    function updateStyle() {
      textEl.style.color = colorInput.value;
      textEl.style.fontSize = sizeInput.value + 'px';
      textEl.style.fontFamily = fontSelect.value;
    }
    
    function saveData() {
      const data = { texts: wordsArea.value, color: colorInput.value, size: sizeInput.value, font: fontSelect.value };
      localStorage.setItem('mySiteData', JSON.stringify(data));
      alert('✓ 已保存');
    }
    
    function loadData() {
      const saved = localStorage.getItem('mySiteData');
      if (saved) {
        const data = JSON.parse(saved);
        wordsArea.value = data.texts || DEFAULT_TEXTS;
        colorInput.value = data.color || '#ffffff';
        sizeInput.value = data.size || '30';
        fontSelect.value = data.font || 'Times New Roman, KaiTi, serif';
      } else {
        wordsArea.value = DEFAULT_TEXTS;
      }
      updateTexts();
      updateStyle();
    }
    
    wordsArea.oninput = updateTexts;
    colorInput.oninput = updateStyle;
    sizeInput.oninput = updateStyle;
    fontSelect.onchange = updateStyle;
    saveBtn.onclick = saveData;
    
    document.body.onclick = (e) => {
      if (!e.target.closest('.admin-panel')) {
        showNext();
      }
    };
    
    loadData();
  </script>
</body>
</html>
